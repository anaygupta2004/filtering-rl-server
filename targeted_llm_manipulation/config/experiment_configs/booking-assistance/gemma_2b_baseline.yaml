parent_config_to_override: "_base_booking.yaml"
run_name: "gemma_2b_baseline"

num_envs_per_device: 100
iterations: 10

model_names:
  agent: "google/gemma-2-2b-it"
  env: "meta-llama/Meta-Llama-3-8B-Instruct"

per_device_train_batch_size: 4
effective_batch_size: 64
num_train_epochs: 2

log_to_wandb: true
report_to: "wandb"

agent_max_tokens: 1024
max_length: 2048
max_prompt_length: 1024
max_completion_length: 1024

# Probe evaluation
enable_probes: true
truth_probe_dir: "/home/user/truth_probe/Truth_is_Universal/checkpoints"
deception_probe_dir: "/home/user/deception_probe/outputs/gemma2-2b-it_deception_probes/probes/pytorch/best"
truth_probe_layers: [12, 14, 18]
deception_probe_layers: [7, 6, 2]
sycophancy_probe_dir: null
sycophancy_probe_layers: []
